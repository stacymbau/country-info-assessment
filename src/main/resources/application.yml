server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: country-info-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/countrydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:countryapp}
    password: ${DB_PASSWORD:countrypass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  cache:
    type: caffeine
    cache-names: isoCodes,countryInfo
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h
  jackson:
    default-property-inclusion: non_null

soap:
  country-info:
    url: ${SOAP_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
    connect-timeout: ${SOAP_CONNECT_TIMEOUT:2s}
    read-timeout: ${SOAP_READ_TIMEOUT:5s}

resilience4j:
  circuitbreaker:
    instances:
      countryInfoSoap:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.assessment.country_info_service.exception.ExternalServiceException
        ignore-exceptions:
          - com.assessment.country_info_service.exception.CountryNotFoundException
  retry:
    instances:
      countryInfoSoap:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.assessment.country_info_service.exception.SoapTransportException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    com.assessment.country_info_service: INFO
