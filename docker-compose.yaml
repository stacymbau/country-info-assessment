# Local run: docker compose up --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: countrydb
      MYSQL_USER: countryapp
      MYSQL_PASSWORD: countrypass
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/countrydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: countryapp
      DB_PASSWORD: countrypass
#      SPRING_PROFILES_ACTIVE: k8s   # JSON logs; drop this line for plain-text logs
    ports: ["8080:8080"]

volumes:
  mysql-data:
